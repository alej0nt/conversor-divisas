<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Convierte monedas al instante: USD, EUR, COP y más. Conversor de divisas online, resultados en tiempo real y sin registro.">
  <meta name="keywords" content="
conversor de divisas,
convertidor de monedas,
calculadora de divisas,
tasa de cambio,
tipo de cambio hoy,
convertir dólares a pesos colombianos,
USD a COP,
EUR a USD,
conversión de monedas en tiempo real,
gráfico historial divisas,
historial de tipo de cambio,
app conversor de divisas,
conversor para viajes,
convertir monedas online,
precio dólar hoy,
conversor,
divisas,
">

  <title>Conversor de Divisas</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WBRWRZ3D" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
     
  <!-- NAVBAR -->
  <app-navbar active="converter"></app-navbar>

  <!-- HERO IMAGE -->
  <div class="hero-section">
    <img src="assets/hero-image.png" alt="Banner decorativo de divisas" class="hero-image">
  </div>

  <div class="container">
    <h1>Conversor de Divisas</h1>

    <!-- INTERFAZ 1: Conversor -->
    <section aria-label="Conversor de divisas" id="converter">
      <div class="converter">
        <div class="input-container">
          <label for="amount">Cantidad</label>
          <input type="number" id="amount" placeholder="Introduce la cantidad" required />
        </div>

        <div class="currency-selectors">
          <div class="select-container">
            <label for="from-currency">De</label>
            <select id="from-currency"></select>
          </div>
          <div class="actions">
            <button class="swapBtn" id="swapBtn" aria-label="Intercambiar monedas" title="Intercambiar monedas">
              <img src="assets/swap-icon.png" alt="Intercambiar">
            </button>
          </div>

          <div class="select-container">
            <label for="to-currency">A</label>
            <select id="to-currency"></select>
          </div>
        </div>

        <div class="actions">
          <button class="convertBtn" id="convertBtn">Convertir</button>
          <button id="verHistoricoBtn" class="historicoBtn" >Ver histórico de tasas</button>
        </div>

        <div class="result-container" aria-live="polite">
          <div class="result-header">
            <img src="assets/calculator-icon.png" alt="Resultado" class="result-icon">
            <h2>Resultado</h2>
          </div>
          <p id="converted-amount">0</p>
          <img src="assets/success-icon.png" alt="Conversión exitosa" class="success-icon" style="display: none;">
        </div>

        <div class="input-container">
          <label for="exchange-rate">Tasa de cambio personalizada (opcional)</label>
          <input type="number" id="exchange-rate-custom" placeholder="Ej: 4200.50" step="0.01" min="0" />
        </div>
      </div>

    </section>

  </div>

  <!-- FOOTER CON ONDAS Y ENLACES -->  
  <app-footer></app-footer>

  <script type="module" src="dist/converter.js"></script>
</body>

</html>
