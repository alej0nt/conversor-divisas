<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="Convierte monedas al instante: USD, EUR, COP y más. Conversor de divisas online, resultados en tiempo real y sin registro.">
  <meta name="keywords" content="
conversor de divisas,
convertidor de monedas,
calculadora de divisas,
tasa de cambio,
tipo de cambio hoy,
convertir dólares a pesos colombianos,
USD a COP,
EUR a USD,
conversión de monedas en tiempo real,
gráfico historial divisas,
historial de tipo de cambio,
app conversor de divisas,
conversor para viajes,
convertir monedas online,
precio dólar hoy,
conversor,
divisas,

">


  <title>Conversor de Divisas</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

</head>

<body>
  <div class="container">
    <div class="historyBtnContainer">
      <button onclick="location.href='history.html'" class="historyBtn" aria-label="Ver historial"
        title="Ver historial">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </button>
    </div>
    <h1>Conversor de Divisas</h1>

    <!-- INTERFAZ 1: Conversor -->
    <section aria-label="Conversor de divisas">
      <div class="converter">
        <div class="input-container">
          <label for="amount">Cantidad</label>
          <input type="number" id="amount" placeholder="Introduce la cantidad" required />
        </div>

        <div class="currency-selectors">
          <div class="select-container">
            <label for="from-currency">De</label>
            <select id="from-currency"></select>
          </div>
          <div class="actions">
            <button class="swapBtn" id="swapBtn" aria-label="Intercambiar monedas" title="Intercambiar monedas">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"></polyline>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <polyline points="7 23 3 19 7 15"></polyline>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
              </svg>
            </button>
          </div>

          <div class="select-container">
            <label for="to-currency">A</label>
            <select id="to-currency"></select>
          </div>
        </div>

        <div class="actions">
          <button class="convertBtn" id="convertBtn">Convertir</button>
        </div>

        <div class="result-container" aria-live="polite">
          <h2>Resultado</h2>
          <p id="converted-amount">0</p>
        </div>

        <div class="input-container">
          <label for="exchange-rate">Tasa de cambio personalizada (opcional)</label>
          <input type="number" id="exchange-rate-custom" placeholder="Ej: 4200.50" step="0.01" min="0" />
        </div>

        <canvas id="historicalChart"></canvas>

      </div>

    </section>


  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="dist/index.js"></script>
</body>

</html>
