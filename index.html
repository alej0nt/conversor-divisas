<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Conversor de Divisas</h1>
        
        <div class="converter">
            <div class="input-container">
                <label for="amount">Cantidad</label>
                <input type="number" id="amount" placeholder="Introduce la cantidad" required>
            </div>
            
            <div class="currency-selectors">
                <div class="select-container">
                    <label for="from-currency">De</label>
                    <select id="from-currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="MXN">MXN</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>
                
                <div class="select-container">
                    <label for="to-currency">A</label>
                    <select id="to-currency">
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                        <option value="MXN">MXN</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>
            </div>
            
            <div class="actions">
                <button class="convert-btn" id="convert-btn">Convertir</button>
                <button class="swap-btn" id="swap-btn">Cambiar</button>
            </div>
            
            <div class="result-container">
                <h2>Resultado</h2>
                <p id="result">0</p>
            </div>
        </div>
        
        <!-- Historial de conversiones en tabla -->
        <div class="history">
            <h2>Historial de Conversiones</h2>
            <table id="history-table">
                <thead>
                    <tr>
                        <th>De</th>
                        <th>A</th>
                        <th>Cantidad</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody id="history-list">
                    <!-- Aquí aparecerán las conversiones realizadas -->
                </tbody>
            </table>
            <button class="clear-history-btn" id="clear-history-btn">Vaciar Historial</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
